name: Actualizar avisos

# Los avisos se guardan en la rama `data`, que Netlify no publica: actualizar
# avisos no dispara deploys ni consume créditos de Netlify.
on:
  schedule:
    - cron: '0 7 * * *' # 04:00 en Argentina
  workflow_dispatch:
    inputs:
      budget:
        description: Fichas máximas por inmobiliaria
        default: '300'

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node crawler/run.mjs --data data --budget "${{ inputs.budget || '300' }}"
      - name: Commitear avisos en la rama data si cambiaron
        working-directory: data
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Sin cambios en los avisos."
            exit 0
          fi
          git config user.name "cuadra-bot"
          git config user.email "cuadra-bot@users.noreply.github.com"
          git add listings.json state.json geocode.json
          git commit -m "Actualizar avisos ($(node -p "require('./listings.json').listings.length") con ubicación)"
          git push
