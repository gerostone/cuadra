[build]
  publish = "public"
  command = "npm test"
  # Solo compilar si cambió la app: cada deploy de producción consume créditos.
  # (Los avisos viven en la rama `data` y no pasan por Netlify.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify.toml"

# El service worker se revisa en cada visita para que las actualizaciones lleguen enseguida.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[dev]
  framework = "#static"
  publish = "public"
