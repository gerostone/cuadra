[build]
  publish = "public"
  command = "npm test"
  # Solo compilar si cambió la app: cada deploy de producción consume créditos.
  # (Los avisos viven en la rama `data` y no pasan por Netlify.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- public/ netlify.toml"

[dev]
  framework = "#static"
  publish = "public"
