<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuadra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="map" role="application" aria-label="Mapa de propiedades"></div>

<header class="top">
  <div class="pill"><i class="mark" aria-hidden="true"></i><b>Cuadra</b><span class="live" id="liveDot" hidden></span><span id="status">Buscando tu ubicación…</span></div>
  <div class="filters" role="toolbar" aria-label="Filtros">
    <div class="seg" id="opSeg">
      <button data-op="todo" aria-pressed="true">Todo</button>
      <button data-op="venta" aria-pressed="false">Venta</button>
      <button data-op="alquiler" aria-pressed="false">Alquiler</button>
    </div>
    <div class="seg" id="ambSeg" aria-label="Ambientes">
      <button data-amb="0" aria-pressed="true">Amb.</button>
      <button data-amb="1" aria-pressed="false">1</button>
      <button data-amb="2" aria-pressed="false">2</button>
      <button data-amb="3" aria-pressed="false">3</button>
      <button data-amb="4" aria-pressed="false">4+</button>
    </div>
    <button class="chip" id="favChip" aria-pressed="false">♥ Guardadas</button>
    <button class="chip" id="petChip" aria-pressed="false">Acepta mascotas</button>
    <button class="chip" id="credChip" aria-pressed="false">Apto crédito</button>
  </div>
</header>

<div class="fabs">
  <button class="fab" id="walkBtn" aria-pressed="false" title="Simular caminata" aria-label="Simular caminata">
    <svg viewBox="0 0 24 24"><circle cx="13" cy="4" r="2"/><path d="M9 21l2-6 3 3v3M7 12l3-4 4 1 2 4M10 8l1 7"/></svg>
  </button>
  <button class="fab" id="locBtn" title="Centrar en mí" aria-label="Centrar en mi ubicación">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>
  </button>
</div>

<section class="bottom" aria-label="Propiedades cerca tuyo">
  <div class="bar-head"><div class="count"><span id="count">0</span> <span id="countLabel">propiedades a 500 m</span></div></div>
  <div class="cards" id="cards"></div>
  <div class="empty" id="empty" hidden>No hay propiedades con esos filtros en esta zona. Caminá unas cuadras o aflojá los filtros.</div>
</section>

<div id="alertWrap" aria-live="polite"></div>
<div class="sheet-bg" id="sheetBg" hidden></div>
<article class="sheet" id="sheet" hidden aria-modal="true" role="dialog"></article>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
